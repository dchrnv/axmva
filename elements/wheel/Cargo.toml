[package]
name = "axmva-wheel"
version = "0.1.0"
edition = "2024"

# Реализация elements/wheel (см. passport.yaml рядом). Поведение (растущая
# последовательность, атомарный оборот, last_touched только по реальному
# касанию) повторяет проверенную axmg (/home/assis/axmg/shelf/src/wheel.rs),
# переписано как своя реализация. Отличие от axmg: Surprise (s_static/
# s_growth/verdict) здесь сознательно не входит в Колесо — отдельный элемент
# поверх (см. passport.yaml, must_not_touch, open_questions).

[dependencies]
axmva-core = { path = "../core" }
