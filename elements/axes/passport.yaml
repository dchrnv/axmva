# Черновик (status: hypothesis), предложен агентом по прямой команде пользователя
# на основе ../../drafts/axmv2-deck-map.md («Стихии и матрица», «Паспорт стихии»)
# и ../../drafts/axmv2-time-module.md (шаг 2 порядка). Метафора (Маг, тузы,
# придворные) живёт только в документах; здесь — нейтральные имена из «Словаря»
# deck-map: pair_table (выбор осей), element (клетка токена), interaction_matrix.
passport_schema: "0.2"
kind: code
status: hypothesis
version: 0.1.0
role: "Выбор двух бинарных осей-стихий из пула мер, классификация токена на клетку, агрегация в матрицу популяции/полки"

inputs:
  - {name: measure_pool, type: "list<Measure>", meaning: "пул мер-кандидатов на оси: изменение счётчика, разнообразие контекстов, сцепление, период, энтропия соседей и др."}
  - {name: token_events, type: "stream<Event>", meaning: "события журналов по токену за оборот"}

outputs:
  - {name: element_filter, type: ElementFilter, meaning: "зафиксированные на цикл оси (axes), бинаризация по медиане популяции, гистерезис перехода, опциональный prototype"}
  - {name: element_cell, type: "u2 (mutable × adaptive)", meaning: "клетка токена: одна из четырёх (земля/вода/огонь/воздух в документах), по порогу двух осей"}
  - {name: interaction_matrix, type: "f32[4][4]", meaning: "доля токенов на масштабе популяции/полки по (стихия объекта, стихия окружения его хвоста)"}

depends_on:
  - {id: core, version_range: ">=0.1.0"}
  - {id: time, version_range: ">=0.1.0"}
must_not_touch: [смысл]   # поведенческая стихия не смысловое поле — см. invariant ниже

links_in:
  - from: core
    channel: direct
    format: "token outputs (counter, level)"
    mode: read
    gate: {accepts: [core], rate_limit: "", min_score: {}, provenance_required: false}
  - from: time
    channel: direct
    format: "age_inner (S-growth), stamp"
    mode: read
    gate: {accepts: [time], rate_limit: "", min_score: {}, provenance_required: false}

contract:
  requires:
    - what: "Поведенческая стихия считается только из потока (счётчик, контексты), никогда из человеческого слова или метки"
      class: invariant
      status: hypothesis
      check: {test: "вычисление element_cell не читает ни одного текстового словаря/метки, только измеримые события потока", metric: "число использований внешней метки при вычислении клетки", threshold: "0"}
    - what: "Если ни одна пара мер из пула не проходит критерии (баланс, независимость, устойчивость между оборотами и источниками, информативность), слой стихий целиком не создаётся"
      class: invariant
      status: hypothesis
      check: {test: "отказ Мага зафиксирован явным результатом «стихий нет», а не частичным/произвольным выбором", metric: "", threshold: ""}
    - what: "Бинаризация по медиане популяции своего уровня даёт баланс, близкий к 50/50"
      class: target
      status: hypothesis
      check: {test: "доля токенов по каждую сторону медианы на реальном корпусе", metric: "отклонение от 50/50", threshold: ""}
    - what: "Две оси взаимно независимы (низкая взаимная информация)"
      class: target
      status: hypothesis
      check: {test: "взаимная информация между двумя бинаризованными осями на реальных корпусах", metric: "mutual information", threshold: ""}
  bonus: ["третья ось соционики как пресет поверх тех же Axis — не обещано"]
  guarantees: []
  known_losses: []

cost: {ram: "", time: ""}
droppable: {value: true, why: "сам черновик явно допускает выброс слоя целиком, если данные не проходят критерии баланса/независимости/устойчивости/информативности — встроенный путь отказа, не исключение (принцип «не плодить»)"}
sources: ["../../drafts/axmv2-deck-map.md", "../../drafts/axmv2-time-module.md"]
open_questions:
  - "Пул мер зависит от «разнообразия контекстов» и от событий Колеса. Колесо (elements/epoch) и PPMI (elements/ppmi) теперь оба реальны и протестированы — depends_on ниже всё ещё указывает только core и time, не обновлён на epoch/ppmi; сама мера «разнообразие контекстов» через PPMI-граф ещё не написана для этого элемента."
  - "Конкретные функции для двух осей не принято (черновик предлагает кандидат по умолчанию для «меняется»/«подстраивается», явно помечен как не согласованный)."
  - "Проверка на 10 корпусах (баланс ~50/50 и независимость осей) не проведена — пороги выше оставлены пустыми намеренно."
  - "Нужен ли prototype (смысловой центр кластера для подписи) вообще — открыто."
  - "cost (ram/time) не измерен."
note: ""
