# Черновик (status: hypothesis), предложен агентом по прямой команде пользователя.
# ПЕРЕСОБРАН 2026-10-28: как и axtime, это теперь самостоятельная, полностью
# обобщённая библиотека (пакет "axaxes") — ни слова про токены/Store/PPMI
# внутри. По ../../drafts/axmv2-deck-map.md («Стихии и матрица», «Паспорт
# стихии»); метафора (Маг, тузы, придворные) живёт только в документах,
# код — нейтральные имена (Quadrant, Binarizer, Debounce, InteractionMatrix).
# Протестировано (15/15) и прогнано на реальных данных через
# tools/axes-integration-demo (не часть этого пакета, намеренно пусто внутри,
# как у axtime).
#
# РЕАЛЬНЫЙ РЕЗУЛЬТАТ ПРОВЕРКИ (закрывает открытый вопрос «баланс/независимость
# не проверены на корпусах»): пул из двух предложенных черновиком мер-кандидатов
# (частота токена, разнообразие контекстов по PPMI) ОТКАЗАН select_pair на двух
# разных файлах (китайский и кириллический текст) — баланс далеко от 50/50
# (0.30-0.40 вместо 0.5) и взаимная информация 0.56-0.60 бит (порог 0.1):
# частые токены на реальных текстах закономерно встречаются в более разных
# контекстах, это не два независимых измерения. Механизм отказа сработал
# ровно так, как задуман (I12/I13-аналог: не подключать слой, а не натягивать
# плохую пару) — слой стихий на этих данных с этими мерами не создаётся.
#
# ИСПРАВЛЕНО 2026-10-31 (Фаза 3 ROADMAP, Шаг 1 — сверка с чертежом axmg,
# инвариант 5): median() паниковал на NaN в измерениях (.expect(...)) —
# заменено на f64::total_cmp (полный порядок без паники, NaN не ожидается
# в валидных данных, но сортировка не должна от этого падать). Сигнатура
# median() не изменилась.
passport_schema: "0.2"
kind: code
status: hypothesis
version: 0.2.1
role: "Обобщённый двуосевой классификатор: выбор пары сбалансированных независимых мер из пула, бинаризация с гистерезисом, классификация в одну из 4 клеток, агрегация в матрицу популяции — без знания о токенах, Store или PPMI"

inputs:
  - {name: measure_pool, type: "list<Candidate<Id>>", meaning: "пул именованных мер-кандидатов: id → f64, передаётся вызывающим кодом целиком"}
  - {name: ids, type: "list<Id> (generic: Eq + Hash + Copy)", meaning: "популяция, на которой оцениваются меры"}
  - {name: criteria, type: SelectionCriteria, meaning: "пороги: максимальное отклонение от баланса 50/50, максимальная взаимная информация"}

outputs:
  - {name: selected_axes, type: "Option<SelectedAxes>", meaning: "выбранная пара (имена, Binarizer на каждую, баланс, mutual information) или None, если ни одна пара не прошла критерии"}
  - {name: quadrant, type: "Quadrant {first: bool, second: bool}", meaning: "клетка элемента — нейтральные поля, не 'стихия'; as_index() даёт 0..=3"}
  - {name: interaction_matrix, type: InteractionMatrix, meaning: "доля пар (своя клетка, клетка окружения) на уровне популяции"}

depends_on: []   # осознанно пусто, как у axtime — это и есть "самостоятельная библиотека"
must_not_touch: [смысл, "конкретный домен (токены/Store/PPMI)"]

links_in: []   # ничего не принимает от других элементов проекта напрямую — вызывающий
                # код (сейчас: tools/axes-integration-demo, не формальный элемент)
                # строит пул мер сам и передаёт готовые HashMap<Id,f64>

contract:
  requires:
    - what: "Поведенческая клетка считается только из переданных числовых мер, никогда из текстовой метки/словаря"
      class: invariant
      status: hypothesis
      check: {test: "Quadrant::classify принимает только bool, вычисленные вызывающим кодом из чисел — структурная гарантия типом, не проверяется отдельным тестом", metric: "", threshold: ""}
    - what: "Если ни одна пара мер из пула не проходит критерии (баланс, независимость), select_pair возвращает None — слой не создаётся частично/произвольно"
      class: invariant
      status: hypothesis
      check: {test: "select_pair_returns_none_when_nothing_clears_the_bar (unit-тест) + реальный результат на двух файлах (см. заголовок файла)", metric: "", threshold: ""}
    - what: "select_pair среди прошедших критерии выбирает пару с наименьшей взаимной информацией, не первую попавшуюся"
      class: invariant
      status: hypothesis
      check: {test: "select_pair_picks_the_balanced_independent_pair_over_a_correlated_one (unit-тест)", metric: "", threshold: ""}
    - what: "Debounce не переключает стабильное значение на одном несогласном наблюдении — только после `required` подряд"
      class: invariant
      status: hypothesis
      check: {test: "debounce_single_contrary_observation_does_not_flip + debounce_flips_after_required_consecutive_disagreements (unit-тесты)", metric: "", threshold: ""}
    - what: "Бинаризация по медиане популяции даёт баланс, близкий к 50/50, НА ТОЙ ЖЕ популяции, от которой считался порог"
      class: invariant
      status: hypothesis
      check: {test: "binarizer_from_median_splits_its_own_population_close_to_half (unit-тест)", metric: "", threshold: "0.5 ± 1e-9 на своей популяции; на НОВЫХ данных не гарантировано (см. fixed_threshold_can_be_unbalanced_on_different_data)"}
  bonus: []
  guarantees: []
  known_losses: ["Критерий 'устойчивость между оборотами и источниками' из черновика не реализован — select_pair судит по одному срезу популяции, не по стабильности выбора во времени.", "Критерий 'информативность для событий конвейера' не реализован — пока нет 'конвейера', который бы определял, что считается информативным."]

cost: {ram: "O(размер пула × размер популяции) при полном переборе пар", time: "O(n² × |ids|) полный перебор пар мер — не оптимизировано, пул ожидается маленьким (единицы-десятки мер)"}
droppable: {value: true, why: "сам черновик явно допускает выброс слоя целиком — встроенный путь отказа (select_pair -> None), подтверждён на реальных данных: отказ уже произошёл, слой не создан"}
sources: ["../../drafts/axmv2-deck-map.md"]
open_questions:
  - "Пул из двух предложенных черновиком мер (частота, разнообразие контекстов) отказан на реальных данных (см. заголовок файла) — нужны другие кандидаты в пул, не те, что предложены как 'первый кандидат, не принят'. Деck-map сам это допускал."
  - "Критерии 'устойчивость' и 'информативность' из черновика не реализованы вообще (см. known_losses) — только баланс и независимость."
  - "РЕШЕНО ЧАСТИЧНО: InteractionMatrix прогнана на реальных парах (элемент, окружение) — окружение определено как сильнейший PPMI-сосед (elements/ppmi), не 'клетка хвоста' из черновика (которая требует окна последовательности, более общее понятие). 1437 пар на three_kingdoms_zh.txt, диагональ (T,T)×(T,T) доминирует (92.2%) — ожидаемо, та же корреляция мер, что уже отказана select_pair выше, видна и здесь. Обобщённое 'окно хвоста' как определение окружения остаётся открытым."
  - "Нужен ли prototype (смысловой центр кластера для подписи) — открыто, не реализован."
  - "Как и у axtime: зависимость от домена (здесь — PPMI) живёт только в tools/axes-integration-demo, не формальном элементе. Не решено, остаётся ли так."
  - "Вынести ли в отдельный публичный репозиторий, как axtime (github.com/dchrnv/axtime) — не решено, ждёт прямой команды."
note: ""
