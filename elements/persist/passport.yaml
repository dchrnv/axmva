# Черновик (status: hypothesis), предложен агентом по прямой команде пользователя.
# Повторяет проверенную axmg (persist.rs), переписано как своя реализация.
# Протестировано (8/8, включая детекцию повреждённого лога и побитовое
# совпадение инкрементального/одноразового save) и прогнано на реальном
# файле ДВУМЯ ОТДЕЛЬНЫМИ ПРОЦЕССАМИ (bin/persist_demo.rs save|load, не один
# прогон с общей памятью).
#
# ИСПРАВЛЕНО 2026-10-29 (по прямой команде пользователя, "исправь сейчас"):
# save()/save_all() раньше тихо ничего не дописывали и возвращали Ok(()),
# если им подсунуть несвязанный Store/DeathLog короче уже сохранённого —
# найдено реальной ошибкой при ручном прогоне (см. журнал решений в
# ROADMAP.md). Теперь оба явно сверяют весь уже сохранённый префикс
# (тела токенов и события лога, не только длину) перед дозаписью и
# возвращают SaveError, если он не совпадает с переданными Store/DeathLog.
# Сигнатуры изменились: Result<(), redb::Error> -> Result<(), SaveError>.
#
# ИСПРАВЛЕНО 2026-10-31 (Фаза 3 ROADMAP, Шаг 1 — сверка с чертежом axmg
# "с нуля", инвариант 5: "без паник, всё через Result"): decode_event()
# паниковал на неизвестный байт типа записи лога (повреждённый файл) —
# теперь возвращает LoadError::CorruptEventKind, новый тест
# load_all_rejects_corrupt_event_kind_byte_instead_of_panicking. 8/8 -> 9/9.
#
# ДОБАВЛЕНО 2026-10-31 (Фаза 3 ROADMAP, Шаг 5 — сверка с чертежом axmg,
# персист сохраняет достаточно для честного restart): новые save_epoch/
# load_epoch — помимо тела Store, явно кэшируют revolution/sequence.ids/
# last_touched_revolution/теги источника (elements/epoch). Без этого
# recall()/age()/source_count() после перезапуска процесса не имели бы
# данных вовсе — sequence ни во что другое не восстанавливается (см.
# drafts/axmv2-truth-vs-derived.md). save/save_all/load/load_all не
# изменились — save_epoch/load_epoch отдельная, более полная пара функций,
# не замена.
#
# НАЙДЕНО при написании приёмочного теста из чертежа (раздел 8, "перезагрузка
# даёт тот же recall"), не придумано заранее: recall() НЕ полностью
# reload-invariant — находит ТЕ ЖЕ кандидаты, но с другим score/порядком,
# потому что recall_from_csr's формула веса использует store.count_of(token),
# а счётчики после load() намеренно нулевые (решение этого элемента, см.
# ниже). surprise() (s_static/s_growth) НЕ зависит от count_of вовсе —
# там вердикт после перезагрузки совпадает точно. Не исправлено тихо —
# задокументировано тестом и open_question.
passport_schema: "0.2"
kind: code
status: hypothesis
version: 0.5.0
role: "Персистентность на redb: тело Store (append-only, инкрементальная дозапись), лог Focus/Unfocus из elements/death, и (save_epoch/load_epoch) явный кэш производного состояния elements/epoch — всё в ACID-транзакциях"

inputs:
  - {name: store, type: "&Store", meaning: "полка (источник: elements/core)"}
  - {name: death_log, type: "&DeathLog", meaning: "лог фокуса (источник: elements/death), опционально — save/load работают и без него"}
  - {name: epoch, type: "&EpochState", meaning: "полное состояние Колеса (источник: elements/epoch) — для save_epoch/load_epoch, помимо Store также sequence/revolution/last_touched_revolution/source_tags"}

outputs:
  - {name: saved_file, type: "redb database", meaning: "файл на диске: BODY_TABLE (всегда) + DEATH_LOG_TABLE (save_all) + EPOCH_META_TABLE/LAST_TOUCHED_TABLE/SOURCE_TAGS_TABLE (save_epoch)"}
  - {name: restored_store, type: Store, meaning: "полка, восстановленная проходом по логу — hash_index/children_arena отстроены заново через intern(), не скопированы напрямую"}
  - {name: restored_death_log, type: DeathLog, meaning: "лог фокуса, восстановленный из таблицы событий; пустой DeathLog, если таблицы нет (старая база)"}
  - {name: restored_epoch, type: EpochState, meaning: "полное состояние Колеса через load_epoch: store+sequence+revolution+last_touched_revolution+source_tags восстановлены; max_sequence_len — настройка вызывающего кода, НЕ персистится, после загрузки всегда None"}
  - {name: "restored_epoch_and_death", type: "(EpochState, DeathLog)", meaning: "load_epoch_and_death — то же, что restored_epoch, плюс DeathLog в той же транзакции; нужен elements/port"}

depends_on:
  - {id: core, version_range: ">=0.1.0"}
  - {id: death, version_range: ">=0.1.0"}
  - {id: epoch, version_range: ">=0.1.0"}
  - {id: recall, version_range: ">=0.1.0"}   # только bin/persist_demo.rs (режим load-epoch), не сама библиотека
must_not_touch: [смысл]

links_in:
  - from: core
    channel: direct
    format: "Store (get, len, intern, hash_of, bytes_of, count_of)"
    mode: read
    gate: {accepts: [core], rate_limit: "", min_score: {}, provenance_required: false}
  - from: death
    channel: direct
    format: "DeathLog (events, focused_set, replay, from_parts)"
    mode: read
    gate: {accepts: [death], rate_limit: "", min_score: {}, provenance_required: false}
  - from: epoch
    channel: direct
    format: "EpochState (store, sequence, revolution, last_touched_revolution, source_tags, from_parts)"
    mode: read
    gate: {accepts: [epoch], rate_limit: "", min_score: {}, provenance_required: false}

contract:
  requires:
    - what: "Счётчики (counts) не персистятся — только тело (level+children); это восстановимый вид, не история"
      class: invariant
      status: hypothesis
      check: {test: "round_trip_preserves_body_and_ids_not_counters (unit-тест)", metric: "count_of после load", threshold: "0 для любого токена"}
    - what: "Инкрементальный save, вызванный несколько раз, даёт тот же результат, что один save в конце (побитово)"
      class: invariant
      status: hypothesis
      check: {test: "incremental_save_matches_one_shot_save_bit_for_bit (unit-тест)", metric: "", threshold: "побитовое совпадение тела и хешей"}
    - what: "load восстанавливает dedup-индекс, не только тела — повторный intern() уже существующего состава не плодит дубликат"
      class: invariant
      status: hypothesis
      check: {test: "load_reconstructs_dedup_index_not_just_bodies (unit-тест) + bin/persist_demo.rs: intern('a') после load вернул id 97, не создал новый", metric: "", threshold: "тот же id, длина стора не растёт"}
    - what: "Повреждённый или переставленный лог даёт Err при загрузке, не тихую рассинхронизацию id"
      class: invariant
      status: hypothesis
      check: {test: "load_detects_corrupt_log_instead_of_silently_desyncing (unit-тест)", metric: "", threshold: "Err, не Ok с неверными id"}
    - what: "save_all/load_all восстанавливают и Store, и DeathLog согласованно в одной транзакции"
      class: invariant
      status: hypothesis
      check: {test: "save_all_and_load_all_round_trip (unit-тест) + bin/persist_demo.rs save|load как два отдельных процесса", metric: "", threshold: "focused_set после load == focused_set до save"}
    - what: "save/save_all сверяют уже сохранённый префикс (тела + события) с переданными Store/DeathLog и возвращают Err при несовпадении или если переданные короче — не тихий no-op"
      class: invariant
      status: hypothesis
      check: {test: "save_rejects_unrelated_shorter_store_instead_of_silently_doing_nothing + save_rejects_body_mismatch_on_diverging_history + save_all_rejects_event_mismatch (unit-тесты) + воспроизведён и исправлен реальный сценарий через bin/persist_demo.rs", metric: "", threshold: "Err, не Ok(()) при расхождении"}
    - what: "Неизвестный байт типа записи лога фокуса (повреждённый файл) даёт Err при загрузке, не панику процесса"
      class: invariant
      status: hypothesis
      check: {test: "load_all_rejects_corrupt_event_kind_byte_instead_of_panicking (unit-тест)", metric: "", threshold: "Err(LoadError::CorruptEventKind), не panic"}
    - what: "save_epoch/load_epoch восстанавливают revolution/sequence.ids/last_touched_revolution/source_tags согласованно; max_sequence_len после загрузки всегда None (настройка, не история)"
      class: invariant
      status: hypothesis
      check: {test: "save_epoch_and_load_epoch_round_trip_everything (unit-тест)", metric: "", threshold: "побитовое совпадение полей, max_sequence_len == None"}
    - what: "save_epoch сверяет уже сохранённый префикс тела (как save/save_all) и возвращает Err при несвязанном короче store, не тихий no-op"
      class: invariant
      status: hypothesis
      check: {test: "save_epoch_rejects_unrelated_shorter_store_like_save_does (unit-тест)", metric: "", threshold: "Err, не Ok(())"}
    - what: "surprise() (s_static/s_growth) после load_epoch даёт тот же вердикт, что до сохранения — не зависит от count_of"
      class: invariant
      status: hypothesis
      check: {test: "reload_preserves_surprise_verdict_exactly_but_recall_scores_only_approximately (unit-тест)", metric: "", threshold: "побитовое совпадение SurpriseReport"}
    - what: "recall() после load_epoch находит ТЕ ЖЕ кандидаты (множество токенов), но score/порядок могут отличаться — зависимость recall_from_csr от count_of, который load_epoch не восстанавливает (см. known_losses)"
      class: target
      status: hypothesis
      check: {test: "reload_preserves_surprise_verdict_exactly_but_recall_scores_only_approximately (unit-тест)", metric: "множество token у кандидатов до/после", threshold: "совпадает; score — не гарантируется"}
  bonus: []
  guarantees: []
  known_losses: ["счётчики (counts) не персистятся ни одной из функций этого элемента (save/save_all/save_epoch) — это восстановимый вид, не история. НАЙДЕНО 2026-10-31: это не нейтрально для recall() — его формула score использует count_of(token) как множитель веса, так что ранжирование кандидатов после перезапуска процесса меняется, хотя сам набор найденных кандидатов не меняется. Если точное совпадение score когда-нибудь понадобится, счётчики придётся либо персистить (противоречит заявленному 'это восстановимый вид'), либо recall() придётся считать свой вес иначе — решение не принято здесь."]

cost: {ram: "LAST_TOUCHED_TABLE/SOURCE_TAGS_TABLE растут как O(число различных тронутых токенов), не O(событий) — перезаписываются целиком на каждый save_epoch, не инкрементально, в отличие от BODY_TABLE/DEATH_LOG_TABLE", time: "O(длины недозаписанного хвоста) на save/save_epoch (тело); O(число тронутых токенов) на save_epoch (last_touched+source_tags, полная перезапись); O(размера полки) на load/load_epoch — полный replay через intern()"}
droppable: {value: true, why: "без персистентности всё работает в памяти одного процесса — просто не переживает перезапуск; ничего из уже построенного технически не зависит от этого элемента"}
sources: ["../../drafts/axmv2-core-passport.md", "../../drafts/axmv2-truth-vs-derived.md"]
open_questions:
  - "Таймлайн/версии (TimelineEntry в axmg) не перенесены — только тела и лог фокуса, без отдельной истории метаданных сессий."
  - "Многопроцессный/многопоточный доступ к одному redb-файлу не проверен — bin/persist_demo.rs запускает save и load строго по очереди, не параллельно."
  - "РЕШЕНО 2026-10-31 (уточнено): счётчики не персистятся — но это влияет ТОЛЬКО на recall() (ранжирование, не набор кандидатов), не на age()/source_count() (персистятся через save_epoch теперь) и не на surprise() (не зависит от count_of вовсе). Старое, более widely-worried формулирование этого open_question снято как неточное."
  - "Raw-поток входных порций (истина по drafts/axmv2-truth-vs-derived.md: revolution+тег+байты, не только их итог) этим шагом НЕ персистится — save_epoch кэширует производное (sequence/last_touched/теги), не саму истину. Полная пересборка с нуля при потере/повреждении этого файла пока не из чего сделать. Остаётся открытым (не входило в скоуп Шага 5, который решал кэш, не поток-истину)."
  - "РЕШЕНО 2026-10-31 (Фаза 3 ROADMAP, Шаг 6): добавлены save_epoch_and_death/load_epoch_and_death — одна транзакция на тело+epoch-кэш+DeathLog вместе, нужны elements/port. save_epoch/load_epoch (без DeathLog) остаются отдельно для случаев, где DeathLog не нужен."
note: ""
