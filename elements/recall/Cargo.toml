[package]
name = "axmva-recall"
version = "0.1.0"
edition = "2024"

# Реализация elements/recall (см. passport.yaml рядом): честный порт
# проверенной axmg (/home/assis/axmg/shelf/src/recall.rs) — поиск кандидатов
# по PPMI-соседям вокруг запроса, ранжирование, декодирование. Первый шаг
# "ассоциативного хвоста колоды" (drafts/axmv2-deck-map.md, карты 7-20,
# Колесница..Суд) — по прямой команде пользователя: сначала честный порт
# целиком, декомпозиция на карты позже, когда недостающие зависимости
# (теги источников, карта ожиданий Отшельника, Дьявол, Башня) появятся.

[dependencies]
axmva-core = { path = "../core" }
axmva-ppmi = { path = "../ppmi" }
axmva-epoch = { path = "../epoch" }
