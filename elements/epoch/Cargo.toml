[package]
name = "axmva-epoch"
version = "0.1.0"
edition = "2024"

# Реализация elements/epoch (см. passport.yaml рядом). Переименован из
# "wheel" по прямой команде пользователя 2026-10-28 — механически это
# циклическая функция шага (вызывается раз за оборот), не отдельная
# подсистема, и код-имя "epoch" уже было записано в Словаре deck-map
# (строка 10, Колесо), просто axmg этому своему правилу не последовал.
# Метафора "Колесо" остаётся только в документах/комментариях.
#
# Поведение (растущая последовательность, атомарный оборот, last_touched
# только по реальному касанию) повторяет проверенную axmg
# (/home/assis/axmg/shelf/src/wheel.rs), переписано как своя реализация.
# Отличие от axmg: Surprise (s_static/s_growth/verdict) здесь сознательно
# не входит сюда — отдельный элемент поверх (см. passport.yaml,
# must_not_touch, open_questions).

[dependencies]
axmva-core = { path = "../core" }
