# Черновик (status: hypothesis), предложен агентом по прямой команде пользователя.
# ПЕРЕИМЕНОВАН из "wheel" в "epoch" 2026-10-28, по прямой команде пользователя:
# механически это циклическая функция шага (вызывается раз за оборот), не
# отдельная подсистема; код-имя "epoch" уже было записано в Словаре
# ../../drafts/axmv2-deck-map.md (строка 10, Колесо), просто axmg этому
# своему правилу не последовал (там структура всё равно WheelState).
# Метафора "Колесо" остаётся только в прозе этого файла, не в коде/id.
#
# Поведение повторяет проверенную axmg (/home/assis/axmg/shelf/src/wheel.rs
# — файл референса не переименован, только наш код), переписано как своя
# реализация в elements/epoch/src/lib.rs, протестировано (4/4) и прогнано
# на реальном файле (bin/epoch_ingest.rs). Отличие от axmg, то, что мы
# вносим: Surprise (s_static/s_growth/verdict) здесь сознательно НЕ часть
# этого элемента — это задел на отдельный элемент (Отшельник), не его
# контракт. См. ../../drafts/axmv2-deck-map.md (Колесо-10) и
# ../../drafts/axmv2-time-module.md.
#
# ДОБАВЛЕНО 2026-10-31 (Фаза 3 ROADMAP, Шаг 4 — сверка с чертежом axmg,
# тег источника): новые turn_tagged/run_corpus_tagged — та же логика, что
# turn/run_corpus, но помечают реально тронутые токены тегом источника.
# source_count(token) читает число РАЗНЫХ тегов. Обычный turn()/
# run_corpus() НЕ изменился (сигнатура и поведение те же) — ни один из
# ~50 существующих вызовов по всему проекту не пришлось переписывать.
# bin/epoch_ingest.rs теперь реально использует тег (раньше вычислял его
# и никуда не передавал — сам был тем разрывом, который чинит этот шаг).
# См. drafts/axmv2-truth-vs-derived.md — тег это часть новой истины
# (поток порций), source_count — производное от него.
passport_schema: "0.2"
kind: code
status: hypothesis
version: 0.4.0
role: "Циклический шаг (метафора проекта — Колесо): оборот как единица времени — принимает порцию (опционально с тегом источника), дозаписывает в накопленную последовательность, прогоняет слияние на всей накопленной свёртке, штампует last_touched и тег источника только по реальному касанию; опционально держит длину рабочей последовательности под заданным потолком"

inputs:
  - {name: byte_chunk, type: bytes, meaning: "порция (REVOLUTION_CHUNK_BYTES, 64 КБ) — один оборот"}
  - {name: max_sequence_len, type: "Option<usize>", meaning: "верхняя граница длины sequence, задаётся вызывающим кодом через with_max_sequence_len(); None по умолчанию — без ограничения, как было"}
  - {name: source_tag, type: "Option<&str>", meaning: "тег источника порции (кто подал: корпус/файл, диалог, сенсор), назначается вызывающим транспортом, не содержимым; None через обычный turn()/run_corpus(), Some через turn_tagged()/run_corpus_tagged()"}

outputs:
  - {name: revolution, type: u32, meaning: "номер последнего завершённого оборота"}
  - {name: last_touched_revolution, type: "map<TokenId,u32>", meaning: "оборот, на котором токен последний раз был прямым элементом свёрнутой последовательности (не через детей, не от простого присутствия без касания)"}
  - {name: sequence, type: "list<TokenId>", meaning: "текущая накопленная свёрнутая последовательность; растёт между оборотами, если max_sequence_len не задан"}
  - {name: new_tokens_count, type: u32, meaning: "число реально рождённых новых примитивов за этот оборот"}
  - {name: truncated_count, type: usize, meaning: "сколько самых старых элементов срезано с начала sequence в этом обороте; 0, если лимит не задан или не достигнут — видно в TurnReport, не тихо"}
  - {name: age, type: "fn(TokenId) -> Option<u32>", meaning: "возраст в оборотах = revolution - last_touched_revolution; считается на лету, не хранится"}
  - {name: source_count, type: "fn(TokenId) -> usize", meaning: "число РАЗНЫХ тегов источника, под которыми токен был реально тронут; 0, если токен никогда не касался через *_tagged-методы"}

depends_on: [{id: core, version_range: ">=0.1.0"}]
must_not_touch: [смысл, surprise]   # оценка новизны/удивления — отдельный элемент поверх, не контракт этого шага

links_in:
  - from: core
    channel: direct
    format: "Store (intern, level_of, bytes_of, touch, count_of), merge::run"
    mode: read_write
    gate: {accepts: [core], rate_limit: "", min_score: {}, provenance_required: false}

contract:
  requires:
    - what: "Атомарность оборота: внешние события принимаются только на границе между оборотами, оборот не прерывается"
      class: invariant
      status: hypothesis
      check: {test: "turn() не возвращает управление до схождения волны слияний для этой порции", metric: "", threshold: "выполняется структурой кода (синхронный вызов), не требует отдельного замера"}
    - what: "last_touched обновляется только при реальном росте счётчика токена в этом обороте, не от простого физического присутствия в последовательности"
      class: invariant
      status: hypothesis
      check: {test: "stale_token_sitting_unchanged_does_not_get_timestamp_refreshed (unit-тест)", metric: "число ложных обновлений штампа", threshold: "0"}
    - what: "revolution монотонно возрастает на 1 за вызов turn()"
      class: invariant
      status: hypothesis
      check: {test: "revolution(n+1) == revolution(n) + 1", metric: "число нарушений", threshold: "0"}
    - what: "Без max_sequence_len (None, по умолчанию) длина sequence не ограничена — старое поведение не изменилось"
      class: invariant
      status: hypothesis
      check: {test: "unbounded_by_default_sequence_can_exceed_any_arbitrary_length (unit-тест) + tools/compare-axmg всё ещё совпадает побитово с axmg на файле под 100К", metric: "", threshold: "truncated_count == 0 всегда, когда лимит не задан"}
    - what: "С заданным max_sequence_len длина sequence после каждого оборота не превышает его; срезаются самые старые элементы (с начала), не случайные и не с конца"
      class: invariant
      status: hypothesis
      check: {test: "with_max_sequence_len_truncates_from_the_front + truncation_keeps_working_across_multiple_turns (unit-тесты)", metric: "sequence.len() после turn()", threshold: "<= max_sequence_len"}
    - what: "Обрезка sequence не трогает тела токенов в Store — только рабочий буфер"
      class: invariant
      status: hypothesis
      check: {test: "truncation_does_not_touch_store_bodies_only_the_working_sequence (unit-тест)", metric: "store.len() до/после", threshold: "store только растёт"}
    - what: "Обычный turn()/run_corpus() никогда не трогает source_tags (нулевой source_count) — тег появляется только через *_tagged-методы"
      class: invariant
      status: hypothesis
      check: {test: "plain_turn_never_populates_source_count (unit-тест)", metric: "source_count для любого токена после обычного turn()", threshold: "0"}
    - what: "source_count считает РАЗНЫЕ теги, не общее число касаний; тот же тег повторно не увеличивает счёт; тег ставится только при реальном касании (тот же критерий, что у last_touched)"
      class: invariant
      status: hypothesis
      check: {test: "turn_tagged_records_the_tag_only_for_tokens_really_touched_this_turn + stale_token_sitting_unchanged_does_not_gain_a_new_source_tag + run_corpus_tagged_tags_every_turn_with_the_same_source (unit-тесты)", metric: "", threshold: ""}
  bonus: []
  guarantees: []
  known_losses: []

cost: {ram: "O(max_sequence_len), если задан; иначе растёт без ограничения", time: "БЕЗ лимита — измерено tools/epoch-cost-bench на Carlsen.pgn (5.7 МБ, 88 оборотов): стоимость оборота стабилизируется на ~0.00035 мс/элемент накопленной последовательности после прогрева (~20 оборотов), т.е. линейна от длины sequence, а не константна — суммарная стоимость по всем оборотам квадратична от размера непрерывного потока. На файлах в единицы МБ это ~10 сек суммарно, не проблема. С ЛИМИТОМ (та же команда, max_sequence_len=50000): время на оборот стабилизируется на ~35-40 мс и дальше НЕ растёт (было до ~270 мс на 88-м обороте без лимита) — лимит реально держит стоимость постоянной, не просто обрезает память."
droppable: {value: false, why: "без оборотов не из чего взять время (stamp, last_touched); Время и, вероятно, Смерть зависят от этого элемента напрямую"}
sources: ["../../drafts/axmv2-deck-map.md", "../../drafts/axmv2-time-module.md", "../../drafts/axmv2-truth-vs-derived.md"]
open_questions:
  - "РЕШЕНО 2026-10-29 (прямая команда пользователя, \"добавляем сразу, делаем всё хорошо\"): окно рабочей последовательности теперь ограничиваемо через with_max_sequence_len(max), явно и опционально (None по умолчанию — старое поведение, побитовое совпадение с axmg на файле под 100К не изменилось). Конкретное число НЕ скопировано у axmg — выведено из измеренной стоимости (~0.00035 мс/элемент): например, бюджет 500 мс/оборот даёт потолок ~1.4М элементов, что в 14 раз больше, чем 100_000 у axmg. Какое значение использовать по умолчанию для реального домена (не теста) — не решено, это теперь вопрос продукта (сколько непрерывного потока ожидается), не инженерии."
  - "РЕШЕНО: elements/surprise (Отшельник) реализован и не требует зависимости от этого элемента вообще — s_static/s_growth читают только &Store напрямую, не EpochState. Разделение подтвердилось дешёвым. РЕШЕНО (2026-10-29): интеграция, кто вызывает surprise::s_growth на каждом реальном обороте и копит в axtime, — отдельный элемент elements/clock, не часть epoch и не tools/."
  - "cost (time) без лимита — измерено (см. cost выше), растёт линейно от длины sequence на диапазоне до ~750К элементов (Carlsen.pgn). За пределами этого диапазона (многодневный непрерывный поток) не измерено, только экстраполировано."
  - "РЕШЕНО 2026-10-31: тег источника теперь реализован (turn_tagged/run_corpus_tagged/source_count), закрывает открытый вопрос из elements/external-input/passport.yaml и drafts/axmv2-deck-map.md ('Вход: от корпуса к первому циклу'). Тег — простая String, не интернирована/не registry — на масштабе с тысячами разных источников это может стать заметной накладной тратой (HashSet<String> на источник на токен), не измерено."
  - "source_tags хранится в памяти процесса, не персистится — persist (Шаг 5 Фазы 3 ROADMAP) пока не знает об этом новом поле; план уже учитывает это (drafts/axmv2-truth-vs-derived.md: тег — часть новой истины, поток порций)."
note: ""
