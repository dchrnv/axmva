# Черновик (status: hypothesis), предложен агентом по прямой команде пользователя.
# ПЕРЕСОБРАН 2026-10-28: по прямой команде пользователя это теперь самостоятельная,
# полностью обобщённая библиотека (пакет "axtime", не "axmva-time") — ни слова
# про TokenId/Store внутри, обобщена по произвольному Id: Eq + Hash + Copy.
# Виды времени 1,2,3,5 из ../../drafts/axmv2-time-module.md ("Набор для v1").
# ДОПОЛНЕН тем же днём модулем `wall` (настенное/календарное время, std::time,
# без внешних зависимостей) — по прямой команде пользователя: библиотека должна
# быть "красивой и качественной" и предлагать стандартные варианты (время
# сейчас / по тикам), даже то, что домену axmva сегодня не нужно. Источник
# уровней — второй черновик, AXMV2/Уровни абстракции/Время.md (уровни 0-8 для
# ИИ в целом); уровни 5-8 (релятивистское, ветвящееся, петли, метафизическое)
# сознательно не реализованы — умозрительны, не выражаются реальным кодом.
# Протестировано (11/11: 7 тиковых + 4 настенных, включая найденный и
# исправленный off-by-one в индексации накопленного ряда) и прогнано на
# реальном файле через tools/time-integration-demo (не часть этого пакета —
# см. depends_on/open_questions, намеренно пусто внутри).
#
# ВЫНЕСЕН 2026-10-28 в отдельный репозиторий github.com/dchrnv/axtime (public,
# MIT OR Apache-2.0) по прямой команде пользователя — "сохранить как axmg и
# просто подключать". Код (src/, Cargo.toml/.lock) удалён из этого репозитория;
# здесь остаётся только паспорт. Подключается тем же способом, что axmg в
# tools/compare-axmg — локальный path-зависимостью к сестринскому чекауту
# (/home/assis/axtime), тот же известный компромисс по портируемости.
#
# РЕШЕНО 2026-10-29: интеграция с доменом axmva (age_inner по-настоящему, не
# только в демо) теперь формальный элемент elements/clock, не
# tools/time-integration-demo (удалён — дублировал бы elements/clock).
passport_schema: "0.2"
kind: code
status: hypothesis
version: 0.3.0
role: "Обобщённый модуль времени: тик + id + момент касания → порядковое время, относительный возраст, внутренняя длительность (накопленный рост), период повторения; плюс независимый модуль настенного времени (std::time) — без знания о токенах, Store или о чём-либо из домена axmva"

inputs:
  - {name: growth_delta, type: f64, meaning: "прирост за текущий тик, передаётся в advance() вызывающим кодом — библиотека не вычисляет его сама"}
  - {name: touched_id, type: "Id (generic: Eq + Hash + Copy)", meaning: "id, который вызывающий код считает реально тронутым на текущем тике"}

outputs:
  - {name: stamp, type: u32, meaning: "вид 1: номер текущего тика"}
  - {name: age, type: "Option<u32>", meaning: "вид 2: сейчас − last_touched; None, если id не касались"}
  - {name: age_inner, type: "Option<f64>", meaning: "вид 3: inner[сейчас] − inner[last_touched]; возраст в накопленном росте, не в тиках"}
  - {name: period, type: "Option<f64>", meaning: "вид 5: средний промежуток между встречами id по тикам; None при <2 встречах"}
  - {name: "wall::now_wall_clock", type: SystemTime, meaning: "календарное «сейчас» — для логов/корреляции с внешним миром, не для измерения длительности"}
  - {name: "wall::RealTouchLog::age", type: "Option<Duration>", meaning: "реальная (не тиковая) длительность с последнего касания, на Instant — устойчива к скачкам системных часов"}

depends_on: []   # осознанно пусто — это и есть смысл "самостоятельной библиотеки"
must_not_touch: [смысл, забывание, ассоциации, "конкретный домен (токены/Store)"]

links_in: []   # ничего не принимает от других элементов проекта напрямую — вызывающий
                # код (теперь: elements/clock, формальный элемент) передаёт
                # generic Tick/Id значения через advance()/touch()

contract:
  requires:
    - what: "stamp монотонно возрастает на 1 за каждый advance()"
      class: invariant
      status: hypothesis
      check: {test: "stamp_matches_number_of_advances (unit-тест)", metric: "", threshold: "stamp == число вызовов advance"}
    - what: "age(id) сразу после touch(id) на этом же тике равен 0, растёт на следующих тиках"
      class: invariant
      status: hypothesis
      check: {test: "age_is_zero_right_after_touch_and_grows_afterwards (unit-тест)", metric: "", threshold: ""}
    - what: "touch одного id не меняет last_touched/age другого id (не сбрасывает чужой возраст)"
      class: invariant
      status: hypothesis
      check: {test: "stale_id_sitting_untouched_does_not_get_age_reset_by_other_touches (unit-тест)", metric: "", threshold: ""}
    - what: "age_inner отражает накопленный рост между тиками, а не их количество (может быть мал при многих тиках, если рост на них был мал)"
      class: invariant
      status: hypothesis
      check: {test: "age_inner_tracks_accumulated_growth_not_raw_ticks (unit-тест) — нашёл и поймал off-by-one в индексации inner[]", metric: "", threshold: ""}
    - what: "period — None при менее чем двух встречах id; иначе средний промежуток между соседними встречами"
      class: invariant
      status: hypothesis
      check: {test: "period_is_none_with_fewer_than_two_occurrences + period_is_average_gap_between_occurrences (unit-тесты)", metric: "", threshold: ""}
    - what: "wall::RealTouchLog::age_at(id, now) — чистая функция явного now и сохранённого Instant, не зависит от реальных часов во время теста"
      class: invariant
      status: hypothesis
      check: {test: "age_at_measures_explicit_duration_not_real_clock + touching_one_id_does_not_affect_another (unit-тесты)", metric: "", threshold: ""}
    - what: "wall::RealTouchLog построен на Instant (монотонные часы), не SystemTime — устойчив к скачкам системных часов"
      class: invariant
      status: hypothesis
      check: {test: "структурная гарантия типом (Instant в поле, не SystemTime)", metric: "", threshold: ""}
  bonus: []
  guarantees: ["порядковое время (вид 1) как база, не отменяется другими видами"]
  known_losses: ["Уровни 5-8 второго черновика (AXMV2/Уровни абстракции/Время.md: релятивистское, ветвящееся/квантовое, петли и обратная причинность, метафизическое время) сознательно не реализованы. Это умозрительные уровни для исследовательских архитектур ИИ в целом (PINNs, CTC-сети и т.п.), не выражаются реальным кодом детерминированного байтового движка — не отложено как 'сделаем позже', а честно отмечено как вне досягаемости разумной инженерии сейчас.", "Уровень 4 того же черновика (память и планирование, LTM/STM) не входит в эту библиотеку — это, вероятно, область Смерти (фокус = рабочая память) и будущего recall, не времени как такового."]

cost: {ram: "O(число различных касавшихся id) — три параллельные структуры (TouchLog, GrowthSeries, OccurrenceLog), не одна", time: "не измерено отдельно от интеграции"}
droppable: {value: null, why: "как библиотека — не измерено на реальном масштабе дольше одного файла; как зависимость — теперь elements/clock реально читает её выход (age/age_inner/period/stamp для TokenId)"}
sources: ["../../drafts/axmv2-time-module.md", "AXMV2/Уровни абстракции/Время.md (внешний архив Obsidian, не копируется по правилу проекта — уровни понимания времени 0-8 для ИИ в целом, источник модуля wall и явного отказа от уровней 5-8)", "https://github.com/dchrnv/axtime (фактическое хранилище кода этого элемента)"]
open_questions:
  - "Таксономия kind (specs/Passport.md, 2.1) не различает «наш код, но хранится в отдельном репозитории» от обычного code («в дереве») или external («чужое, не наше»). axtime — наш код, не чужой, но физически вне этого дерева. Не стал по I22 заводить новый kind без правила, которое бы отличалось по умолчанию — честно отмечаю разрыв, решение за пользователем."
  - "РЕШЕНО 2026-10-29: интеграция с доменом axmva теперь формальный элемент elements/clock (не инструмент, не часть epoch). tools/time-integration-demo удалён как дубль."
  - "Зависимость на axtime оформлена локальным path (/home/assis/axtime), не git-зависимостью — работает только на этой машине. Для того чтобы сам axmva стало можно клонировать и собрать где угодно (цель — 'библиотека, которую можно подключать'), это нужно сменить на git-зависимость (например, axtime = { git = \"https://github.com/dchrnv/axtime\" }), когда репозиторий стабилизируется."
  - "period завязан на историю тиков, в которых id был тронут — при долгой работе история растёт без ограничения (OccurrenceLog), как и TouchLog/GrowthSeries. Ограничения памяти не предусмотрены осознанно (библиотека маленькая, на конечных входах не проверялась на больших масштабах)."
  - "Смежная развилка (не предмет этой библиотеки, домен-специфична): жёсткое окно K=3 в Смерти (замерено: +13–23% сжатия на Git) против ретенции с затуханием."
  - "Считать ли «тик» домена agента равным одному событию, или оставить порцию входа как единицу — решение домена (elements/epoch), не этой библиотеки."
