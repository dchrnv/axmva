# Черновик (status: hypothesis), предложен агентом по прямой команде пользователя.
# kind: external — чужое, не в нашем дереве; passport это прокси (см. specs/Passport.md, 2.1).
# Заведён, чтобы у elements/core/passport.yaml появился честный `from` в links_in
# вместо запрещённого по умолчанию входа "из воздуха" (I15: default deny).
# Содержание нарезки/тегов — из ../../drafts/axmv2-deck-map.md, раздел «Вход: от
# корпуса к первому циклу»: ingest_bytes_tagged уже работает в axmg, не с нуля.
#
# РЕШЕНО 2026-10-31 (Фаза 3 ROADMAP, Шаг 4): тег источника теперь принимается
# и хранится в коде — elements/epoch::turn_tagged/run_corpus_tagged/
# source_count (не отдельная функция ingest_bytes_tagged, как в axmg, а
# параметр существующего приёма). bin/epoch_ingest.rs — первый реальный
# транспорт (файл из `input/`), использует тег по имени файла. Контракт
# этого элемента (porция несёт provenance-тег) теперь исполним, не только
# описан.
passport_schema: "0.2"
kind: external
status: hypothesis
version: 0.2.0
role: "Вход модели: корпус или поток диалога режется на порции с тегом источника (ingest_bytes_tagged), прежде чем попасть в ядро — passport-прокси, содержимое не хешируется. Один контракт, несколько возможных транспортов (см. note)."

inputs: []
outputs:
  - {name: bytes_stream, type: bytes, meaning: "порция (64 КБ корпуса, документ, или одна реплика диалога) с тегом источника — функция ingest_bytes_tagged, уже реализована в axmg"}

depends_on: []
must_not_touch: []
links_in: []

contract:
  requires:
    - what: "Каждая порция несёт тег источника (provenance), назначаемый транспортом, а не содержимым сообщения"
      class: invariant
      status: hypothesis
      check: {test: "у каждой выданной порции есть непустой provenance-тег", metric: "доля порций без тега", threshold: "0"}
  bonus: []
  guarantees: []
  known_losses: []

cost: {ram: "", time: ""}
droppable: {value: false, why: "без какого-то внешнего источника данных конвейер не запускается; это не опциональный модуль, это сам факт входа во внешний мир"}
sources: ["../../drafts/axmv2-core-passport.md", "../../drafts/axmv2-deck-map.md"]
open_questions:
  - "Нарезка и правила тега источника различаются по типу данных (текстовый корпус vs поток диалога) — правило на тип данных не определено."
  - "Величина N (прогрев: первые N оборотов до создания стихий, Маг только копит меры) не определена."
  - "Что считать «циклом» для корпуса и для потока диалога — предложено: для корпуса один проход, для потока фиксированное число оборотов; не решено окончательно."
  - "Что считать «первым» кандидатом на полку, когда сравнивать пока не с чем — не решено."
  - "Каждый новый транспорт (камера, микрофон, другие сенсоры) — скорее всего свой собственный kind: external со своей identity для gate (I16), по аналогии с папкой `input/`, а не подключение к той же identity. Не решено окончательно — пока формализован только один транспорт."
note: "Первый конкретный транспорт этого контракта (не единственный): локальная папка `input/` в корне репозитория — туда пользователь руками кладёт файл. Другие транспорты будут добавляться по мере появления: камера, микрофон, другие сенсоры — каждый со своим драйвером-энкодером (аналогия из AXMV2: разный транспорт даёт разную identity связи, см. I16), без изменения этого контракта."
