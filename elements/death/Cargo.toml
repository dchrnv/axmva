[package]
name = "axmva-death"
version = "0.1.0"
edition = "2024"

# Реализация elements/death (см. passport.yaml рядом): mark() по
# достижимости от корней (K=3 + фабричное дно) + weight_cut (срез по весу
# PPMI среди пограничных) + append-only лог Focus/Unfocus, replay.
# Повторяет axmg (death.rs). Персистентность на диск (redb) по-прежнему
# не перенесена — остаётся глубиной, см. open_questions.

[dependencies]
axmva-core = { path = "../core" }
axmva-epoch = { path = "../epoch" }
axmva-ppmi = { path = "../ppmi" }
