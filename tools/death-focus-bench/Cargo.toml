[package]
name = "death-focus-bench"
version = "0.1.0"
edition = "2024"

# Инструмент диагностики, не формальный элемент. Измеряет на СВОИХ данных
# (не цитирует цифру axmg "13-23% сжатия на Git"), даёт ли K=3-отсечение
# фокуса (elements/death) реальный выигрыш в сжатии невиданного продолжения
# того же файла по сравнению с неограниченным (без отсечения) словарём.
# Фаза 3 ROADMAP, Шаг 2.

[dependencies]
axmva-core = { path = "../../elements/core" }
axmva-epoch = { path = "../../elements/epoch" }
axmva-death = { path = "../../elements/death" }
axmva-surprise = { path = "../../elements/surprise" }
